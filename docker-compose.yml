# =============================================================================
# LandPulse AI — Docker Compose (Development)
# =============================================================================
# Usage:
#   cp .env.example .env   # fill in secrets first
#   docker compose up --build
#   docker compose down -v  # to wipe volumes
# =============================================================================

services:

  # ─── PostgreSQL + PostGIS ─────────────────────────────────────────────────
  db:
    image: postgis/postgis:16-3.4
    container_name: landpulse_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ladris}
      POSTGRES_USER: ${POSTGRES_USER:-ladris_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-landpulse_pass}
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ladris_user} -d ${POSTGRES_DB:-ladris}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - landpulse_net

  # ─── FastAPI Backend ──────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: landpulse_backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./ml:/ml
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - landpulse_net

  # ─── React / Vite Frontend ────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: landpulse_frontend
    restart: unless-stopped
    env_file: .env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - landpulse_net

volumes:
  pgdata:
    name: landpulse_pgdata

networks:
  landpulse_net:
    name: landpulse_network
    driver: bridge
